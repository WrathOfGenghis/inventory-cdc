# Prometheus alert rules for the inventory CDC pipeline.
# Mirrors the design in §10 and Appendix A of the report.

groups:
  - name: inventory-cdc.slo
    rules:
      # ---- Latency SLO burn (multi-window) ----
      - alert: InventorySyncLatencySLOBurnFast
        expr: |
          (
            histogram_quantile(0.95,
              rate(sync_latency_seconds_bucket[5m])) > 3
          ) and (
            histogram_quantile(0.95,
              rate(sync_latency_seconds_bucket[1h])) > 3
          )
        for: 5m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "p95 sync latency above 3s SLO (fast burn)"
          runbook: "runbooks/pipeline-halted.md"

      - alert: InventorySyncLatencySLOBurnSlow
        expr: |
          histogram_quantile(0.95,
            rate(sync_latency_seconds_bucket[6h])) > 3
        for: 30m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: "p95 latency degrading over 6h window"

      # ---- Critical: pipeline appears halted ----
      - alert: InventoryConsumerLagHigh
        expr: |
          sum by (topic) (kafka_consumergroup_lag
            {consumergroup="inventory-orchestrator"}) > 50000
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Consumer lag > 50k for 10m"

      - alert: InventoryEventsThroughputZero
        expr: |
          rate(events_processed_total{result="applied"}[5m]) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No events applied for 5m -- pipeline halted?"

      # ---- DLQ saturation ----
      - alert: InventoryDLQSpike
        expr: |
          rate(events_dlq_total[5m]) > 10
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "DLQ rate > 10/s for 5m"
          runbook: "runbooks/schema-break.md"

      # ---- Schema drift ----
      - alert: InventorySchemaWarningRising
        expr: |
          rate(schema_warnings_total[15m]) > 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Schema-warning rate rising; new contract version incoming"

      # ---- Reconciliation mismatch ----
      - alert: InventoryReconciliationMismatchHigh
        expr: inventory_mismatch_total > 100
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Reconciliation found > 100 mismatches"
