# Prometheus scrape configuration for the local Docker Compose stack.
# Production uses the kube-prometheus-stack chart with a ServiceMonitor
# generated from the Helm chart; this file is for `make up` only.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    pipeline: inventory-cdc

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8080"]
        labels:
          service: inventory-orchestrator

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
