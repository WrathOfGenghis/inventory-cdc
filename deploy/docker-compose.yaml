# Local development stack for the inventory CDC pipeline.
#
# Brings up the full set of dependencies described in §21.6 of the design
# report: Postgres (with logical replication), Kafka + Schema Registry,
# Debezium Connect, Redis, Prometheus, and Grafana.
#
# Tested with Docker Compose v2.27 / Docker Engine 24.x.
#
# Start:    docker compose -f deploy/docker-compose.yaml up -d
# Stop:     docker compose -f deploy/docker-compose.yaml down
# Wipe:     docker compose -f deploy/docker-compose.yaml down -v

name: inventory-cdc

services:
  postgres:
    image: postgres:15.4
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schema/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 12

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: inventory-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: inventory-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.1
    container_name: inventory-schema-registry
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  debezium:
    image: debezium/connect:2.5.0.Final
    container_name: inventory-debezium
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: inventory-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  redis:
    image: redis:7.2-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  orchestrator:
    build:
      context: ..
      dockerfile: Dockerfile
    image: inventory-cdc/orchestrator:dev
    container_name: inventory-orchestrator
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: cdc.inventory.warehouse
      KAFKA_GROUP: inventory-orchestrator
      KAFKA_DLQ_TOPIC: cdc.inventory.dlq
      POSTGRES_DSN: postgres://app:app@postgres:5432/warehouse?sslmode=disable
      REDIS_ADDR: redis:6379
      SCHEMA_CONTRACT: /app/schema/contracts/inventory.v3.yaml
      METRICS_ADDR: ":8080"
      LOG_LEVEL: info

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: inventory-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/alerts.yaml:/etc/prometheus/alerts.yaml:ro

  grafana:
    image: grafana/grafana:10.2.0
    container_name: inventory-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana:/etc/grafana/provisioning/dashboards:ro

volumes:
  postgres_data:
