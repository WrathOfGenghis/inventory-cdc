# Strimzi Kafka cluster CR used by the production deployment described in
# §12 of the design. Three brokers spread across three availability zones
# with replication factor 3 and min.insync.replicas=2 — enough to lose any
# single zone without losing committed messages.
#
# Apply with:
#   kubectl apply -n inventory-prod -f deploy/strimzi/kafka-cluster.yaml

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: inventory-kafka
  labels:
    app.kubernetes.io/part-of: inventory-cdc
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      - name: external
        port: 9094
        type: cluster-ip
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
      log.message.format.version: "3.7"
      inter.broker.protocol.version: "3.7"
    storage:
      type: persistent-claim
      size: 200Gi
      class: ssd
      deleteClaim: false
    rack:
      topologyKey: topology.kubernetes.io/zone
    template:
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                strimzi.io/name: inventory-kafka-kafka
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi

  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 50Gi
      class: ssd
      deleteClaim: false
    template:
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                strimzi.io/name: inventory-kafka-zookeeper

  entityOperator:
    topicOperator: {}
    userOperator: {}
