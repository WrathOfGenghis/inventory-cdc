name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          if [ -n "$(gofmt -l . | grep -v '^vendor/')" ]; then
            echo "gofmt -l found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  schema-contract:
    name: Schema contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyyaml
        run: pip install pyyaml jsonschema

      - name: Validate every contract YAML parses
        run: |
          python - <<'PY'
          import sys, yaml, pathlib
          required_top = {"version", "required_fields", "types"}
          ok = True
          for p in pathlib.Path("schema/contracts").glob("*.yaml"):
              data = yaml.safe_load(p.read_text())
              missing = required_top - set(data or {})
              if missing:
                  print(f"{p}: missing top-level keys {missing}")
                  ok = False
              else:
                  print(f"{p}: OK (version={data['version']})")
          sys.exit(0 if ok else 1)
          PY

  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [lint-and-test, schema-contract]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: inventory-cdc/orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint
        run: helm lint deploy/helm/inventory-cdc

      - name: helm template
        run: |
          helm template inventory-cdc deploy/helm/inventory-cdc \
            -f deploy/helm/inventory-cdc/values-prod.yaml > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml
